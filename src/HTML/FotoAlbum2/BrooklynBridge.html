<h1>Brooklyn Bridge</h1>
<p>Brooklyn Bridge er en af tre broer, som binder bydelene Manhattan og Brooklyn i New York sammen. Den strækker sig 1834 meter over East River. Hovedspændet over selve vandet er 486 meter, noget som gjorde den til verdens længste hængebro, da den stod færdig i 1883. Wikipedia</p>
